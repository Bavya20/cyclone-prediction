<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CycloneTrack Forecasting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-pink: #ff4d94;
            --light-pink: #ff99c2;
            --primary-blue: #4dc3ff;
            --light-blue: #99ddff;
            --dark-blue: #0066cc;
            --dark-gray: #333;
            --light-gray: #f5f5f5;
            --success-green: #2ecc71;
            --error-red: #e74c3c;
        }

        body {
            background-color: #0a192f;
            color: white;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Cyclone background effect */
        .cyclone-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1502134249126-9f3755a50d78?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            z-index: -1;
        }

        /* Animated cyclone spiral overlay */
        .spiral-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            margin-top: -300px;
            margin-left: -300px;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 60%, rgba(77, 195, 255, 0.1) 70%, rgba(255, 77, 148, 0.1) 100%);
            animation: spin 30s linear infinite;
            z-index: -1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Navbar Styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background-color: rgba(10, 25, 47, 0.9);
            backdrop-filter: blur(10px);
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .logo i {
            color: var(--primary-blue);
            margin-right: 10px;
            font-size: 2.2rem;
        }

        .logo span {
            color: var(--primary-pink);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary-pink);
            background-color: rgba(255, 77, 148, 0.1);
        }

        .nav-links a.active {
            color: var(--light-blue);
            background-color: rgba(77, 195, 255, 0.1);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
            transition: all 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 80%;
            left: 10%;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Login Container */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 2rem 5% 5rem;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .login-box {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .login-box:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: var(--light-blue);
            font-size: 1.1rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--light-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group label i {
            color: var(--primary-pink);
        }

        .form-control {
            padding: 1rem 1.2rem;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(255, 255, 255, 0.07);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(77, 195, 255, 0.2);
        }

        .form-control.success {
            border-color: var(--success-green);
        }

        .form-control.error {
            border-color: var(--error-red);
        }

        .input-icon {
            position: relative;
        }

        .input-icon input {
            padding-left: 3rem;
        }

        .input-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-pink);
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--light-blue);
            cursor: pointer;
            font-size: 1.1rem;
        }

        .error-message {
            color: var(--error-red);
            font-size: 0.9rem;
            margin-top: 0.3rem;
            display: none;
        }

        .success-message {
            color: var(--success-green);
            font-size: 0.9rem;
            margin-top: 0.3rem;
            display: none;
        }

        /* Remember Me & Forgot Password */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ccc;
            font-size: 0.95rem;
        }

        .remember-me input {
            accent-color: var(--primary-blue);
        }

        .forgot-password {
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: var(--primary-pink);
            text-decoration: underline;
        }

        /* Submit Button */
        .submit-btn {
            margin-top: 1rem;
            padding: 1.2rem;
            background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 77, 148, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Social Login */
        .social-login {
            margin-top: 2rem;
            text-align: center;
        }

        .social-login p {
            color: #ccc;
            margin-bottom: 1rem;
            position: relative;
        }

        .social-login p::before,
        .social-login p::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .social-login p::before {
            left: 0;
        }

        .social-login p::after {
            right: 0;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.07);
            color: white;
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .social-icon.google:hover {
            background-color: #DB4437;
        }

        .social-icon.github:hover {
            background-color: #333;
        }

        .social-icon.twitter:hover {
            background-color: #1DA1F2;
        }

        /* Register Link */
        .register-link {
            text-align: center;
            margin-top: 2rem;
            color: #ccc;
        }

        .register-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Form Validation Styles */
        .validation-icon {
            position: absolute;
            right: 2.8rem;
            top: 50%;
            transform: translateY(-50%);
            display: none;
        }

        .form-group.success .fa-check-circle {
            display: block;
            color: var(--success-green);
        }

        .form-group.error .fa-exclamation-circle {
            display: block;
            color: var(--error-red);
        }

        /* Footer */
        footer {
            background-color: rgba(10, 25, 47, 0.95);
            padding: 2rem 5% 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: auto;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
            gap: 2rem;
        }

        .footer-column {
            flex: 1;
            min-width: 250px;
        }

        .footer-column h3 {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            color: var(--primary-blue);
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 0.8rem;
        }

        .footer-links a {
            color: #ccc;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--primary-pink);
        }

        .footer-social-icons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .footer-social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .footer-social-icons a:hover {
            background-color: var(--primary-pink);
            transform: translateY(-3px);
        }

        .copyright {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .login-box {
                padding: 2.5rem;
            }
            
            .login-header h1 {
                font-size: 2.2rem;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 1rem 5%;
            }
            
            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: rgba(10, 25, 47, 0.95);
                flex-direction: column;
                padding: 1rem 0;
                text-align: center;
            }
            
            .nav-links.active {
                display: flex;
            }
            
            .mobile-menu-btn {
                display: block;
            }
            
            .login-box {
                padding: 2rem 1.5rem;
            }
            
            .login-header h1 {
                font-size: 2rem;
            }
            
            .spiral-overlay {
                width: 400px;
                height: 400px;
                margin-top: -200px;
                margin-left: -200px;
            }
            
            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .login-header h1 {
                font-size: 1.8rem;
            }
            
            .login-header p {
                font-size: 1rem;
            }
            
            .form-control {
                padding: 0.9rem 1.1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Cyclone Background -->
    <div class="cyclone-bg"></div>
    <div class="spiral-overlay"></div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="{% url 'index' %}" class="logo">
            <i class="fas fa-wind"></i>
            Cyclone<span>Track</span>
        </a>
        
        <div class="nav-links" id="navLinks">
            <a href="{% url 'index' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'register' %}">Registration</a>
            <a href="{% url 'login' %}" class="active">Login</a>
        </div>
        
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Sign in to access your CycloneTrack Forecasting account</p>
            </div>
            
            <form id="loginForm" class="login-form" action="{% url 'login' %}" method="post" novalidate>
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <div class="input-icon">
                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                        <i class="fas fa-envelope"></i>
                        <i class="fas fa-check-circle validation-icon"></i>
                        <i class="fas fa-exclamation-circle validation-icon"></i>
                    </div>
                    <div class="error-message" id="email-error">Please enter a valid email address</div>
                    <div class="success-message" id="email-success">Email is valid</div>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <div class="input-icon">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                        <i class="fas fa-lock"></i>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                        <i class="fas fa-check-circle validation-icon"></i>
                        <i class="fas fa-exclamation-circle validation-icon"></i>
                    </div>
                    <div class="error-message" id="password-error">Please enter your password</div>
                </div>
                
            
                
                <button type="submit" class="submit-btn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                
                
                <div class="register-link">
                    Don't have an account? <a href="{% url 'register' %}">Create Account</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        {% if messages %}
            {% for massage in messages %}
                alert('{{ massage }}');
            {% endfor %}
        {% endif %}
    </script>

   

    <script>
        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');
        
        mobileMenuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            mobileMenuBtn.innerHTML = navLinks.classList.contains('active') 
                ? '<i class="fas fa-times"></i>' 
                : '<i class="fas fa-bars"></i>';
        });

        // Close mobile menu when clicking a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
                mobileMenuBtn.innerHTML = '<i class="fas fa-bars"></i>';
            });
        });

        // Password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        // Form validation
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInputEl = document.getElementById('password');
        
        // Real-time validation functions
        function validateEmail() {
            const email = emailInput.value.trim();
            const errorElement = document.getElementById('email-error');
            const successElement = document.getElementById('email-success');
            const formGroup = emailInput.closest('.form-group');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!emailRegex.test(email)) {
                showError(formGroup, errorElement, successElement, 'Please enter a valid email address');
                return false;
            }
            
            showSuccess(formGroup, errorElement, successElement, 'Email is valid');
            return true;
        }
        
        function validatePassword() {
            const password = passwordInputEl.value;
            const errorElement = document.getElementById('password-error');
            const formGroup = passwordInputEl.closest('.form-group');
            
            if (password.length === 0) {
                showError(formGroup, errorElement, null, 'Please enter your password');
                return false;
            }
            
            errorElement.style.display = 'none';
            formGroup.classList.remove('error');
            return true;
        }
        
        // Helper functions for showing error/success states
        function showError(formGroup, errorElement, successElement, message) {
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            if (successElement) successElement.style.display = 'none';
            formGroup.classList.add('error');
            formGroup.classList.remove('success');
        }
        
        function showSuccess(formGroup, errorElement, successElement, message) {
            errorElement.style.display = 'none';
            if (successElement) {
                successElement.textContent = message;
                successElement.style.display = 'block';
            }
            formGroup.classList.add('success');
            formGroup.classList.remove('error');
        }
        
        // Real-time validation event listeners
        emailInput.addEventListener('input', validateEmail);
        passwordInputEl.addEventListener('input', validatePassword);
        
        

        // Demo credentials auto-fill for testing
        document.addEventListener('keydown', function(e) {
            // Ctrl + D for demo credentials
            if (e.ctrlKey && e.key === 'd') {
                e.preventDefault();
                emailInput.value = 'demo@cyclonetrack.org';
                passwordInputEl.value = 'Demo@123';
                validateEmail();
                validatePassword();
                
                // Show notification
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 100px;
                    right: 20px;
                    background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
                    color: white;
                    padding: 10px 20px;
                    border-radius: 5px;
                    z-index: 10000;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                    font-weight: 600;
                `;
                notification.textContent = 'Demo credentials filled!';
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }
            
            // Ctrl + A for admin credentials
            if (e.ctrlKey && e.key === 'a') {
                e.preventDefault();
                emailInput.value = 'admin@cyclonetrack.org';
                passwordInputEl.value = 'Admin@123';
                validateEmail();
                validatePassword();
                
                // Show notification
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 100px;
                    right: 20px;
                    background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
                    color: white;
                    padding: 10px 20px;
                    border-radius: 5px;
                    z-index: 10000;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                    font-weight: 600;
                `;
                notification.textContent = 'Admin credentials filled!';
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }
        });

        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                
                const targetId = this.getAttribute('href');
                if(targetId === '#') return;
                
                const targetElement = document.querySelector(targetId);
                if(targetElement) {
                    window.scrollTo({
                        top: targetElement.offsetTop - 80,
                        behavior: 'smooth'
                    });
                }
            });
        });
    </script>
</body>
</html>
