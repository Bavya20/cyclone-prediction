<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpatioTemporal Modeling for Cyclone Track Forecasting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-pink: #ff4d94;
            --light-pink: #ff99c2;
            --primary-blue: #4dc3ff;
            --light-blue: #99ddff;
            --dark-blue: #0066cc;
            --dark-gray: #333;
            --light-gray: #f5f5f5;
        }

        body {
            background-color: #0a192f;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        /* Cyclone background effect */
        .cyclone-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1502134249126-9f3755a50d78?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            z-index: -1;
        }

        /* Animated cyclone spiral overlay */
        .spiral-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            margin-top: -300px;
            margin-left: -300px;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 60%, rgba(77, 195, 255, 0.1) 70%, rgba(255, 77, 148, 0.1) 100%);
            animation: spin 30s linear infinite;
            z-index: -1;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(1.1);
            }

            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        /* Navbar Styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background-color: rgba(10, 25, 47, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .logo i {
            color: var(--primary-blue);
            margin-right: 10px;
            font-size: 2.2rem;
        }

        .logo span {
            color: var(--primary-pink);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary-pink);
            background-color: rgba(255, 77, 148, 0.1);
        }

        .nav-links a.active {
            color: var(--light-blue);
            background-color: rgba(77, 195, 255, 0.1);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
            transition: all 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 80%;
            left: 10%;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Hero Section */
        .hero {
            padding: 12rem 5% 8rem;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            animation: fadeInUp 1s ease-out;
        }

        .hero p {
            font-size: 1.3rem;
            margin-bottom: 2.5rem;
            color: var(--light-blue);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        .cta-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 3rem;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 148, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 77, 148, 0.6);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--light-blue);
            border: 2px solid var(--light-blue);
        }

        .btn-secondary:hover {
            background-color: rgba(77, 195, 255, 0.1);
            transform: translateY(-5px);
        }

        /* Features Section */
        .features {
            padding: 6rem 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: white;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
            border-radius: 2px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            margin-top: 3rem;
        }

        .feature-card {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 2.5rem 2rem;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            border-color: var(--primary-blue);
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
        }

        .feature-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: var(--primary-blue);
        }

        .feature-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: white;
        }

        .feature-card p {
            color: #ccc;
            line-height: 1.6;
        }

        /* Stats Section */
        .stats {
            padding: 5rem 5%;
            background-color: rgba(0, 0, 0, 0.3);
            margin: 4rem 0;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }

        .stat-item {
            text-align: center;
            padding: 1.5rem;
            animation: fadeIn 1s ease-out;
        }

        /* Add these styles to your existing CSS */

        /* Model Selection Styles */
        .model-selection-container {
            max-width: 900px;
            margin: 3rem auto 0;
            animation: fadeInUp 1s ease-out 0.9s both;
        }

        .model-selection-form {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--light-blue);
        }

        .form-group label i {
            color: var(--primary-pink);
        }

        .form-control {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(255, 255, 255, 0.07);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(77, 195, 255, 0.2);
        }

        .form-control option {
            background-color: #0a192f;
            color: white;
            padding: 10px;
        }

        /* Algorithm Description */
        .algorithm-description {
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-left: 4px solid var(--primary-blue);
            transition: all 0.3s ease;
        }

        .description-content h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--light-blue);
            margin-bottom: 0.8rem;
            font-size: 1.3rem;
        }

        .description-content h3 i {
            color: var(--primary-pink);
        }

        .description-content p {
            color: #ccc;
            line-height: 1.6;
        }

        /* Algorithm Parameters */
        .algorithm-parameters {
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-left: 4px solid var(--primary-pink);
            display: none;
        }

        .algorithm-parameters.active {
            display: block;
            animation: fadeInUp 0.5s ease-out;
        }

        .parameters-header h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--light-blue);
            margin-bottom: 0.5rem;
            font-size: 1.3rem;
        }

        .parameters-header h3 i {
            color: var(--primary-pink);
        }

        .parameters-header p {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .parameters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .parameter-item {
            display: flex;
            flex-direction: column;
        }

        .parameter-item label {
            color: var(--light-blue);
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .parameter-item input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        .parameter-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary-blue);
            cursor: pointer;
        }

        .parameter-item input[type="number"],
        .parameter-item select {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(255, 255, 255, 0.07);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .parameter-item input[type="number"]:focus,
        .parameter-item select:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 2px rgba(77, 195, 255, 0.2);
        }

        .parameter-value {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Training Actions */
        .training-actions {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .training-actions .btn {
            min-width: 200px;
            padding: 1rem 2.5rem;
        }

        /* Training Progress */
        .training-progress {
            display: none;
            margin-top: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        .training-progress.active {
            display: block;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .progress-header h3 {
            color: var(--light-blue);
            font-size: 1.2rem;
        }

        .progress-percentage {
            color: var(--primary-pink);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .progress-bar {
            height: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 5px;
        }

        .progress-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            color: #aaa;
            font-size: 0.9rem;
        }

        .progress-detail {
            display: flex;
            justify-content: space-between;
        }

        .progress-detail span:last-child {
            color: white;
            font-weight: 600;
        }

        /* Training Results */
        .training-results {
            display: none;
            margin-top: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        .training-results.active {
            display: block;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .result-card {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            border-top: 3px solid var(--primary-blue);
        }

        .result-card h4 {
            color: var(--light-blue);
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
        }

        .result-value.good {
            color: var(--success-green);
        }

        .result-value.average {
            color: var(--warning-yellow);
        }

        .result-value.poor {
            color: var(--danger-red);
        }

        .result-label {
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Add these color variables if not already present */
        :root {
            --success-green: #2ecc71;
            --warning-yellow: #f39c12;
            --danger-red: #e74c3c;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .model-selection-form {
                padding: 2rem;
            }

            .training-actions {
                flex-direction: column;
            }

            .training-actions .btn {
                width: 100%;
            }

            .parameters-grid {
                grid-template-columns: 1fr;
            }
        }

        .stat-number {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 1.2rem;
            color: var(--light-blue);
        }

        /* Footer */
        footer {
            background-color: rgba(10, 25, 47, 0.95);
            padding: 3rem 5% 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
            gap: 2rem;
        }

        .footer-column {
            flex: 1;
            min-width: 250px;
        }

        .footer-column h3 {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            color: var(--primary-blue);
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 0.8rem;
        }

        .footer-links a {
            color: #ccc;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--primary-pink);
        }

        .social-icons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            background-color: var(--primary-pink);
            transform: translateY(-3px);
        }

        .copyright {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            font-size: 0.9rem;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .hero h1 {
                font-size: 2.8rem;
            }

            .features-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 1rem 5%;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: rgba(10, 25, 47, 0.95);
                flex-direction: column;
                padding: 1rem 0;
                text-align: center;
            }

            .nav-links.active {
                display: flex;
            }

            .mobile-menu-btn {
                display: block;
            }

            .hero {
                padding: 10rem 5% 6rem;
            }

            .hero h1 {
                font-size: 2.3rem;
            }

            .hero p {
                font-size: 1.1rem;
            }

            .cta-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }

            .spiral-overlay {
                width: 400px;
                height: 400px;
                margin-top: -200px;
                margin-left: -200px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 2rem;
            }

            .section-title {
                font-size: 2rem;
            }

            .stat-number {
                font-size: 2.8rem;
            }

            .feature-card {
                padding: 2rem 1.5rem;
            }
        }

        button[type="submit"] {
            background: linear-gradient(to right, var(--primary-pink), var(--primary-blue));
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(77, 195, 255, 0.4);
        }

        button[type="submit"]:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(77, 195, 255, 0.2);
        }
    </style>
</head>

<body>
    <!-- Cyclone Background -->
    <div class="cyclone-bg"></div>
    <div class="spiral-overlay"></div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="{% url 'home' %}" class="logo">
            <i class="fas fa-wind"></i>
            Cyclone<span>Track</span>
        </a>

        <div class="nav-links" id="navLinks">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'view_dataset' %}">View Dataset</a>
            <a href="{% url 'model_train' %}" class="active">Model Train</a>
            <a href="{% url 'prediction' %}">Prediction</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>

        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Model Training</h1>
        <p>Select the algorithm for model training and configure parameters</p>

        <div class="model-selection-container">
            <div class="model-selection-form">
                <div class="form-group">
                    <form action="{% url 'model_train' %}" method="post">
                        {% csrf_token %}
                        <label for="algorithm-select"><i class="fas fa-brain"></i> Select Algorithm</label>
                        <select id="algorithm-select" class="form-control" name="algorithm">
                            <option value="" disabled selected>Choose an algorithm...</option>
                            <option value="1">Random Forest</option>
                            <option value="2">XGBoost</option>
                            <option value="3">LSTM (Long Short-Term Memory)</option>
                            <option value="4">ANN (Artificial Neural Network)</option>
                        </select>
                        <br><br>
                        <button type="submit">
                            Submit
                        </button>
                    </form>
                </div>
            </div>
            <br>
            {% if msg %}
            <center>
                <h2> {{ msg }} </h2>
                <br>
                <img src="/static/images/image.png" alt="Algorithm Comparison">
            </center>
            {% endif %}
        </div>
    </section>








    <script>
        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');

        mobileMenuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            mobileMenuBtn.innerHTML = navLinks.classList.contains('active')
                ? '<i class="fas fa-times"></i>'
                : '<i class="fas fa-bars"></i>';
        });

        // Close mobile menu when clicking a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
                mobileMenuBtn.innerHTML = '<i class="fas fa-bars"></i>';
            });
        });

        // Animate stats when they come into view
        const observerOptions = {
            threshold: 0.5
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const statItems = entry.target.querySelectorAll('.stat-item');
                    statItems.forEach((item, index) => {
                        setTimeout(() => {
                            item.style.animation = 'fadeIn 1s ease-out';
                        }, index * 200);
                    });
                }
            });
        }, observerOptions);

        observer.observe(document.querySelector('.stats'));

        // Add smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();

                const targetId = this.getAttribute('href');
                if (targetId === '#') return;

                const targetElement = document.querySelector(targetId);
                if (targetElement) {
                    window.scrollTo({
                        top: targetElement.offsetTop - 80,
                        behavior: 'smooth'
                    });
                }
            });
        });
    </script>
</body>

</html>
